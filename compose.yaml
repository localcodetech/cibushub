services:
  server:
    build:
      context: ./server
      target: dev
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    init: true
  client:
    build:
      context: ./client
      target: dev
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    volumes:
      - ./client:/app
      - /app/node_modules
    init: true
