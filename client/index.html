<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123c2a" />
    <meta
      name="description"
      content="Order food from restaurants in Kumasi and get it delivered."
    />
    <title>CibusHub</title>
    <!-- Open the connection to Google early: its sign-in button then appears faster -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />
    <!-- Pick light or dark before the page is drawn, so it never flashes the wrong colours.
         A saved choice wins; otherwise follow the phone's own setting. -->
    <script>
      try {
        var savedTheme = localStorage.getItem("cibushub-theme");
        var phonePrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (savedTheme === "dark" || (!savedTheme && phonePrefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {
        // Storage blocked: stay light
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
