<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123c2a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>You're offline · CibusHub</title>
    <!-- Shown by the service worker when a page is opened with no internet [AC-UX-11].
         Everything is inside this one file, because nothing else can be downloaded offline. -->
    <style>
      :root {
        --background: #fbf8f1;
        --foreground: #2b2118;
        --muted: #6b5d4f;
        --primary: #123c2a;
        --primary-foreground: #fbf8f1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0f1712;
          --foreground: #f2eadb;
          --muted: #a99f8f;
          --primary: #6cc497;
          --primary-foreground: #0f1712;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        margin-top: 24px;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192x192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        CibusHub needs the internet to show restaurants and orders.<br />Check your connection and
        try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
